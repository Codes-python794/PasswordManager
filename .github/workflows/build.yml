name: Build EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIP_FILE: Password_manager.zip   # غيّر الاسم لو الـ zip عندك باسم تاني

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: pwsh
        run: |
          Expand-Archive -Path $env:ZIP_FILE -DestinationPath project -Force
          $main = Get-ChildItem project -Recurse -Filter main.py | Select-Object -First 1
          if (-not $main) { throw "main.py not found inside $env:ZIP_FILE" }
          "APP_DIR=$($main.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r "$env:APP_DIR/requirements.txt" pyinstaller pytest

      - name: Run tests (if any)
        shell: pwsh
        run: |
          cd $env:APP_DIR
          if (Test-Path test_app.py) { python -m pytest -v }

      - name: Build exe
        shell: pwsh
        run: |
          cd $env:APP_DIR
          pyinstaller --onefile --windowed --name PasswordManager main.py

      - uses: actions/upload-artifact@v4
        with:
          name: PasswordManager-windows
          path: ${{ env.APP_DIR }}/dist/PasswordManager.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/dist/PasswordManager.exe
