name: Build Password Manager EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller cryptography
        # إذا كان لديك ملف متطلبات، قم بإلغاء التفعيل للسطر التالي:
        # if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    # (اختياري) إذا كنت بحاجة لفك ضغط أي ملفات إضافية أثناء البناء
    - name: Extract Archive (if needed)
      shell: pwsh
      run: |
        if (Test-Path "archive.zip") {
          Expand-Archive -Path "archive.zip" -DestinationPath "./extracted" -Force
        }

    - name: Build Executable with PyInstaller
      run: |
        # بناء الملف التنفيذي دمج الملفات معاً (onefile) وإخفاء نافذة الأوامر السوداء (noconsole)
        # استبدل main.py بملف التشغيل الرئيسي لديك إذا كان مختلفاً
        pyinstaller --noconsole --onefile --name="PasswordManager" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PasswordManager-EXE
        path: dist/*.exe
